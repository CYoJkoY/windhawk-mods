name: Sync Yoko mods

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-yoko-mods
  cancel-in-progress: true

env:
  SOURCE_REPO: CYoJkoY/Yoko-Windhawk-Mods
  SOURCE_REF: main
  MANIFEST_PATH: .github/sync/yoko-mods.txt

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Fetch latest main
        run: git fetch origin main && git reset --hard origin/main

      - name: Fetch source mods
        env:
          SOURCE_REPO: ${{ env.SOURCE_REPO }}
          SOURCE_REF: ${{ env.SOURCE_REF }}
        run: |
          rm -rf "$RUNNER_TEMP/yoko-windhawk-mods"
          git clone \
            --depth 1 \
            --filter=blob:none \
            --sparse \
            --branch "$SOURCE_REF" \
            "https://github.com/$SOURCE_REPO.git" \
            "$RUNNER_TEMP/yoko-windhawk-mods"
          git -C "$RUNNER_TEMP/yoko-windhawk-mods" sparse-checkout set mods
          test -d "$RUNNER_TEMP/yoko-windhawk-mods/mods"

      - name: Build source manifest
        run: |
          git -C "$RUNNER_TEMP/yoko-windhawk-mods" ls-files | \
            awk '/^mods\/.*\.wh\.cpp$/ { print }' | \
            sort > "$RUNNER_TEMP/source-yoko-mods.txt"

      - name: Reconcile managed mods
        env:
          MANIFEST_PATH: ${{ env.MANIFEST_PATH }}
        run: |
          set -euo pipefail

          mkdir -p "$(dirname "$MANIFEST_PATH")"

          if [[ -f "$MANIFEST_PATH" ]]; then
            sort -u "$MANIFEST_PATH" > "$RUNNER_TEMP/previous-yoko-mods.txt"
          else
            : > "$RUNNER_TEMP/previous-yoko-mods.txt"
          fi

          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            if [[ "$path" != mods/*.wh.cpp ]]; then
              echo "ERROR: invalid managed path: $path"
              exit 1
            fi
          done < "$RUNNER_TEMP/previous-yoko-mods.txt"

          comm -23 \
            "$RUNNER_TEMP/previous-yoko-mods.txt" \
            "$RUNNER_TEMP/source-yoko-mods.txt" | \
          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            rm -f -- "$path"
          done

          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            mkdir -p "$(dirname "$path")"
            install -m 0644 \
              "$RUNNER_TEMP/yoko-windhawk-mods/$path" \
              "$path"
          done < "$RUNNER_TEMP/source-yoko-mods.txt"

          cp "$RUNNER_TEMP/source-yoko-mods.txt" "$MANIFEST_PATH"

      - name: Commit and push to main
        run: |
          set -euo pipefail

          if git diff --quiet -- mods "$MANIFEST_PATH"; then
            echo 'No Yoko mod changes detected.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mods "$MANIFEST_PATH"
          git commit -m 'sync: reconcile mods from Yoko-Windhawk-Mods'

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push raced with main; rebasing (attempt $attempt)."
            git fetch origin main
            git rebase origin/main
          done

          echo 'ERROR: unable to push synchronized changes after 3 attempts.'
          exit 1
