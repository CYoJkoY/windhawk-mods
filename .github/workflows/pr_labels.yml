name: PR flow labels

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - converted_to_draft
      - closed
    branches:
      - main

# The workflow only checks out the trusted base branch and runs the repository's
# own label-management script. Use the repository token so the fork does not
# depend on the upstream Windhawk reviewer app's private key.
permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-flow-labels-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: .github

      - name: Update the flow label
        uses: actions/github-script@v9
        with:
          github-token: ${{ github.token }}
          # A transient 5xx would otherwise fail the run halfway through a label
          # change. 4xx codes stay exempt, so removeLabels still sees its 404.
          retries: 3
          script: |
            const flow = require('${{ github.workspace }}/.github/pr_flow.cjs');
            await flow.handlePullRequestEvent({ github, context, core });
