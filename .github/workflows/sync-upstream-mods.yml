name: Generate upstream mods branch

on:
  workflow_run:
    workflows:
      - Sync Yoko mods
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-upstream-mods
  cancel-in-progress: false

env:
  UPSTREAM_REPO: ramensoftware/windhawk-mods
  UPSTREAM_REF: main
  TARGET_BRANCH: upstream-mods

jobs:
  generate:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Fetch latest main
        run: git fetch origin main && git reset --hard origin/main

      - name: Fetch upstream
        run: |
          git remote add upstream "https://github.com/$UPSTREAM_REPO.git"
          git fetch --no-tags upstream "$UPSTREAM_REF"

      - name: Build upstream-only branch
        run: |
          set -euo pipefail

          patch="$RUNNER_TEMP/upstream-mods.patch"
          git diff --binary "upstream/$UPSTREAM_REF...origin/main" -- mods/ > "$patch"

          git checkout --detach "upstream/$UPSTREAM_REF"
          git clean -fdx

          if [[ -s "$patch" ]]; then
            git apply --3way "$patch"
          fi

          echo 'Changed files in generated upstream branch:'
          git diff --name-only "upstream/$UPSTREAM_REF" --

          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            case "$path" in
              mods/*.wh.cpp) ;;
              *)
                echo "ERROR: generated branch contains forbidden path: $path"
                exit 1
                ;;
            esac
          done < <(git diff --name-only "upstream/$UPSTREAM_REF" --)

          if git diff --quiet "origin/$TARGET_BRANCH" --; then
            echo 'Generated branch is already up to date.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A mods
          git commit -m 'sync: generate upstream-only mod branch'
          git push --force-with-lease origin "HEAD:refs/heads/$TARGET_BRANCH"
